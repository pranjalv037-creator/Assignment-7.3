
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Listing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>ShopEase</h1>
        <p>Discover products you'll love</p>
    </header>

    <main>
        <h2 class="section-title">Our Products</h2>

        <section class="product-container">

            <article class="product-card">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500"
                     alt="Wireless headphones">
                <div class="product-info">
                    <h3>Wireless Headphones</h3>
                    <p class="price">₹1,499</p>
                    <button type="button">Add to Cart</button>
                </div>
            </article>

            <article class="product-card">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500"
                     alt="Classic wristwatch">
                <div class="product-info">
                    <h3>Classic Watch</h3>
                    <p class="price">₹1,999</p>
                    <button type="button">Add to Cart</button>
                </div>
            </article>

            <article class="product-card">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"
                     alt="Red sports shoes">
                <div class="product-info">
                    <h3>Sports Shoes</h3>
                    <p class="price">₹2,499</p>
                    <button type="button">Add to Cart</button>
                </div>
            </article>

            <article class="product-card">
                <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=500"
                     alt="Instant camera">
                <div class="product-info">
                    <h3>Instant Camera</h3>
                    <p class="price">₹3,499</p>
                    <button type="button">Add to Cart</button>
                </div>
            </article>

            <article class="product-card">
                <img src="https://images.unsplash.com/photo-1503602642458-232111445657?w=500"
                     alt="Modern chair">
                <div class="product-info">
                    <h3>Modern Chair</h3>
                    <p class="price">₹2,799</p>
                    <button type="button">Add to Cart</button>
                </div>
            </article>

            <article class="product-card">
                <img src="https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=500"
                     alt="Over-ear headphones">
                <div class="product-info">
                    <h3>Premium Headphones</h3>
                    <p class="price">₹2,199</p>
                    <button type="button">Add to Cart</button>
                </div>
            </article>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 ShopEase. All rights reserved.</p>
    </footer>

</body>
</html>
